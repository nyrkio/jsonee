[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonee"
version = "0.0.1"
description = "JSON-end-to-end ASGI framework for nyrkiov3"
requires-python = ">=3.11"
dependencies = [
    "secantusdb",
    "pymongo",
    # Single-source-of-options config loader exposed via jsonee.config.
    # Apps get a pre-wired ConfigArgParse parser with JsonEE's standard
    # file discovery and service options; they add app-specific
    # options on top.
    "ConfigArgParse",
    # YAML config files. PyYAML is the backend ConfigArgParse uses
    # when the config file is YAML.
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../PureJson/src", "../ExtendedJsonSchema/src"]
asyncio_mode = "auto"
