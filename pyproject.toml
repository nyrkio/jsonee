[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonee"
version = "0.0.1"
description = "JSON-end-to-end ASGI framework for nyrkiov3"
requires-python = ">=3.11"
dependencies = ["secantusdb", "pymongo"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../PureJson/src", "../ExtendedJsonSchema/src"]
asyncio_mode = "auto"
